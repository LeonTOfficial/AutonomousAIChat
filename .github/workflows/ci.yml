name: macOS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Swift version
        run: swift --version

      - name: Test
        run: swift test

      - name: Release build without warnings
        run: swift build -c release -Xswiftc -warnings-as-errors

      - name: Build app bundle
        run: ./start.command --build-only
